cleaner_config_comment_item_interval: "Item cleanup interval (seconds)"
cleaner_config_comment_item_warn_times: "Warning times before an item cleanup (seconds)"
cleaner_config_comment_item_whitelist: "Item whitelist (items that are never cleaned)"
cleaner_config_comment_item_ignore_named: "Ignore items with a custom name"
cleaner_config_comment_item_ignore_recent: "Ignore freshly dropped items (seconds)"
cleaner_config_comment_entity_enabled: "Enable entity cleanup"
cleaner_config_comment_entity_interval: "Entity cleanup interval (seconds)"
cleaner_config_comment_entity_warn_times: "Warning times before an entity cleanup (seconds)"
cleaner_config_comment_entity_types: "Entity types to clean"
cleaner_config_comment_entity_whitelist_named: "Do not clean entities with a custom name"
cleaner_config_comment_entity_whitelist_leashed: "Do not clean leashed entities"
cleaner_config_comment_entity_whitelist_tamed: "Do not clean tamed entities"
cleaner_config_comment_worlds_blacklist: "Worlds that are never cleaned"
cleaner_config_comment_smart_enabled: "Enable smart cleanup (triggered automatically when entity counts pass a threshold)"
cleaner_config_comment_smart_item_threshold: "Item count threshold (smart cleanup triggers above this number)"
cleaner_config_comment_smart_mob_threshold: "Mob count threshold (smart cleanup triggers above this number)"
cleaner_config_comment_smart_cooldown: "Smart cleanup cooldown (seconds)"
