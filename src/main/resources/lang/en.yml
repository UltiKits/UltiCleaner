cleaner_config_comment_tps_adaptive_enabled: "Enable TPS-adaptive thresholds"
cleaner_config_comment_tps_sample_window: "TPS sampling window (1m/5m/15m)"
cleaner_config_comment_tps_low_threshold: "Low TPS threshold"
cleaner_config_comment_tps_critical_threshold: "Critical TPS threshold"
cleaner_config_comment_tps_low_reduction: "Threshold reduction percentage when TPS is low"
cleaner_config_comment_tps_critical_reduction: "Threshold reduction percentage when TPS is critical"
cleaner_config_comment_messages_warn: "Cleanup warning message ({TIME} is the remaining seconds)"
cleaner_config_comment_messages_entity_warn: "Entity cleanup warning message"
cleaner_config_comment_messages_item_cleaned: "Item cleanup finished message ({COUNT} is the number cleaned)"
cleaner_config_comment_messages_entity_cleaned: "Entity cleanup finished message ({COUNT} is the number cleaned)"
