# UltiCleaner 语言文件 (简体中文)

# 系统消息
cleaner_enabled: "UltiCleaner 已启用！"
cleaner_reloaded: "UltiCleaner 配置已重载！"

# 清理消息
item_warn: "&c[清理] &f地面物品将在 &e{TIME} &f秒后清理！"
entity_warn: "&c[清理] &f实体将在 &e{TIME} &f秒后清理！"
item_cleaned: "&a[清理] &f已清理 &e{COUNT} &f个地面物品！"
entity_cleaned: "&a[清理] &f已清理 &e{COUNT} &f个实体！"

# 智能清理
smart_clean_triggered: "&e[清理] &f检测到实体数量过多，正在进行智能清理..."

# 进度显示
clean_progress: "&7[清理] &f清理进度: &e{CURRENT}&f/&e{TOTAL}"
clean_in_progress: "&e清理正在进行中，请稍候..."

# 事件相关
clean_cancelled: "&c[清理] &f清理操作被其他插件取消！"

# 命令帮助
cmd_help_title: "&6=== UltiCleaner 帮助 ==="
cmd_help_items: "&e/clean items &f- 清理地面物品"
cmd_help_entities: "&e/clean entities &f- 清理实体"
cmd_help_all: "&e/clean all &f- 清理所有"
cmd_help_check: "&e/clean check &f- 查看实体统计"
cmd_help_status: "&e/clean status &f- 查看清理状态"

# 状态显示
status_title: "&6=== 清理状态 ==="
status_next_item_clean: "&e下次物品清理: &f{TIME} 秒"
status_next_entity_clean: "&e下次实体清理: &f{TIME} 秒"
status_cleaning: "&e清理状态: &a进行中..."
status_idle: "&e清理状态: &7空闲"

# 统计显示
stats_title: "&6=== 服务器实体统计 ==="
stats_items: "&e地面物品: &f{COUNT}"
stats_mobs: "&e可清理生物: &f{COUNT}"
stats_total: "&e实体总数: &f{COUNT}"
stats_chunks_loaded: "&e已加载区块: &f{COUNT}"
stats_tps: "&e服务器TPS: &f{TPS}"

# 命令描述（/help 中显示）
command_description: "清理地面物品和实体"

# 手动清理
clean_started_items: "&a已开始清理 {COUNT} 个地面物品（分批处理中）..."
clean_started_entities: "&a已开始清理 {COUNT} 个实体（分批处理中）..."
clean_started_all: "&a已开始清理 {ITEMS} 个物品和 {ENTITIES} 个实体（分批处理中）..."

# /clean status 与 /clean check 显示的 TPS
status_tps: "&eTPS: {TPS}"
status_tps_critical: "&c⚠ TPS严重过低，智能清理阈值已降低{PERCENT}%"
status_tps_low: "&e⚠ TPS较低，智能清理阈值已降低{PERCENT}%"
tps_status_critical: "&c{TPS} (严重)"
tps_status_low: "&e{TPS} (偏低)"
tps_status_normal: "&a{TPS} (正常)"

# 控制台
log_server_detected: "检测到服务端: {SERVER}"
log_tps_monitor_initialized: "TPS 监控已初始化。服务端: {SERVER}"
log_config_default_save_failed: "已按服务器语言写入 {FILE} 中的消息，但保存失败: {ERROR}"
log_unknown_entity_type: "未知的实体类型: {TYPE}"
log_empty_warn_times: "config/cleaner.yml 中的 {KEY} 为空，或没有任何可用的整数秒；已改用默认值 {DEFAULT}。"
log_unknown_whitelist_material: "config/cleaner.yml 的 item.whitelist 中列出了 {VALUE}，它不是材料名，不会保护任何物品，已忽略。"
removed_key_warning: "[UltiCleaner] {FILE} 仍包含 '{KEY}'，当前版本已不再读取该键。{REASON} 从文件中删除该键即可消除此警告。"
removed_key_reason_prefix: "从未有任何代码读取这个键，所以从没有消息因它加上前缀，删除它不会改变你看到的任何内容。清理广播中的前缀是该广播自身文本的一部分：要修改某条消息，请编辑对应的 'messages.*' 键（UltiKits/UltiCleaner#18）。"
removed_key_reason_chunk: "区块卸载功能已移除：服务端引擎本身就会卸载闲置区块，所以本模块的实现只可能触及服务端有意保留的那些区块。没有替代设置（UltiKits/UltiCleaner#27）。"

# config/cleaner.yml 中各配置项上方的注释，按服务器语言写入（CleanerConfig 中的 {key} 引用）
cleaner_config_comment_item_enabled: "启用物品清理"
cleaner_config_comment_item_interval: "清理间隔（秒）"
cleaner_config_comment_item_warn_times: "清理前警告时间点（秒）"
cleaner_config_comment_item_whitelist: "物品白名单（不会被清理的物品）"
cleaner_config_comment_item_ignore_named: "忽略有自定义名称的物品"
cleaner_config_comment_item_ignore_recent: "忽略刚掉落的物品（秒）"
cleaner_config_comment_entity_enabled: "启用实体清理"
cleaner_config_comment_entity_interval: "实体清理间隔（秒）"
cleaner_config_comment_entity_warn_times: "实体清理前警告时间点（秒）"
cleaner_config_comment_entity_types: "要清理的实体类型"
cleaner_config_comment_entity_whitelist_named: "不清理有自定义名称的实体"
cleaner_config_comment_entity_whitelist_leashed: "不清理被拴绳栓住的实体"
cleaner_config_comment_entity_whitelist_tamed: "不清理被驯服的实体"
cleaner_config_comment_worlds_blacklist: "不进行清理的世界"
cleaner_config_comment_smart_enabled: "启用智能清理（基于实体数量阈值自动触发）"
cleaner_config_comment_smart_item_threshold: "物品数量阈值（超过此数量触发智能清理）"
cleaner_config_comment_smart_mob_threshold: "生物数量阈值（超过此数量触发智能清理）"
cleaner_config_comment_smart_cooldown: "智能清理冷却时间（秒）"
cleaner_config_comment_batch_size: "每tick清理的实体数量（分批清理减少卡顿）"
cleaner_config_comment_batch_show_progress: "向OP显示清理进度"
cleaner_config_comment_tps_adaptive_enabled: "启用TPS自适应阈值调整"
cleaner_config_comment_tps_sample_window: "TPS采样窗口（1m/5m/15m）"
cleaner_config_comment_tps_low_threshold: "低TPS阈值"
cleaner_config_comment_tps_critical_threshold: "严重低TPS阈值"
cleaner_config_comment_tps_low_reduction: "低TPS时阈值降低百分比"
cleaner_config_comment_tps_critical_reduction: "严重低TPS时阈值降低百分比"
cleaner_config_comment_messages_warn: "清理警告消息 ({TIME}为剩余秒数)"
cleaner_config_comment_messages_entity_warn: "实体清理警告消息"
cleaner_config_comment_messages_item_cleaned: "物品清理完成消息 ({COUNT}为清理数量)"
cleaner_config_comment_messages_entity_cleaned: "实体清理完成消息 ({COUNT}为清理数量)"
cleaner_config_comment_messages_smart_triggered: "智能清理触发消息"
cleaner_config_comment_messages_clean_progress: "清理进度消息"
cleaner_config_comment_messages_clean_cancelled: "清理被取消消息"
