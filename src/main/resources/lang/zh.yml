# UltiCleaner 语言文件 (简体中文)

# 系统消息
cleaner_enabled: "UltiCleaner 已启用！"
cleaner_reloaded: "UltiCleaner 配置已重载！"

# 清理消息
item_warn: "&c[清理] &f地面物品将在 &e{TIME} &f秒后清理！"
